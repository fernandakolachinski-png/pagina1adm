<section id="solucoes" class="calculadora-section">
        <h2>Simulador de Economia Hídrica</h2>
        <p>Descubra quantos litros de água você pode economizar por dia mudando para a irrigação inteligente.</p>
        
        <div class="calculadora-box">
            <label for="minutos">Minutos de irrigação diária tradicional:</label>
            <input type="number" id="minutos" placeholder="Ex: 30" min="1">
            <button onclick="calcularEconomia()">Calcular Economia</button>
            
            <div id="resultado" class="resultado-oculto">
                <p>Com o sistema <strong>AgrinhoInova</strong>, você economizaria aproximadamente:</p>
                <h3 id="litros-economizados">0 Litros</h3>
                <span class="dica">Isso equivale a cerca de <span id="baldes">0</span> baldes de água por dia!</span>
            </div>
        </div>
    </section>

    <script>
        function calcularEconomia() {
            let minutos = document.getElementById('minutos').value;
            let resultadoDiv = document.getElementById('resultado');
            
            if (minutos > 0) {
                // Supondo uma economia média de 12 litros por minuto comparado ao método tradicional
                let litrosEconomizados = minutos * 12;
                // Um balde médio tem cerca de 10 litros
                let totalBaldes = Math.round(litrosEconomizados / 10);
                
                document.getElementById('litros-economizados').innerText = litrosEconomizados + " Litros por dia";
                document.getElementById('baldes').innerText = totalBaldes;
                
                // Mostra a caixinha de resultado com animação
                resultadoDiv.style.display = "block";
            } else {
                alert("Por favor, insira um número válido de minutos.");
            }
        }
    </script>
