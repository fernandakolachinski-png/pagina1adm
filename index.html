<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroAvisos - Agrinho 2026</title>
    <style>
        /* Estilo simplificado para evitar erros */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f1;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-top: 8px solid #2e7d32;
        }
        h1 { color: #2e7d32; }
        select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 16px;
        }
        select { border: 1px solid #ccc; }
        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #1b5e20; }
        .alerta {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none; /* Começa escondido */
            font-weight: bold;
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
